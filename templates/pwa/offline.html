{% load static %}
<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0955b5">
<title>Offline | {{ app_branding.app_name|default:'Clasvanta' }}</title>
<link rel="icon" type="image/png" href="{% static 'pwa/icon-192.png' %}">
<style>
*{box-sizing:border-box}body{align-items:center;background:#f6f8fc;color:#243651;display:flex;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;justify-content:center;margin:0;min-height:100vh;padding:24px}
.card{background:#fff;border:1px solid #dce6f3;border-radius:20px;box-shadow:0 14px 40px rgba(13,65,130,.08);max-width:430px;padding:32px;text-align:center}
.icon{border-radius:18px;height:84px;width:84px}h1{font-size:1.45rem;line-height:1.2;margin:18px 0 8px}p{color:#546478;margin:10px 0 20px}
button{background:#0955b5;border:0;border-radius:10px;color:#fff;cursor:pointer;font:inherit;font-weight:700;padding:10px 20px}
small{color:#64748b;display:block;margin-top:18px}
</style></head><body>
<main class="card"><img class="icon" src="{% static 'pwa/icon-192.png' %}" alt="">
<h1>You're offline</h1>
<p>Reconnect to the internet to continue using {{ app_branding.app_name|default:'Clasvanta' }}.</p>
<button type="button" onclick="window.location.reload()">Try again</button>
<small>For your privacy, attendance records, student information and reports are not stored offline.</small>
</main></body></html>
